<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموصل شوب - الوثائق القانونية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #3949ab 0%, #7c4dff 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        .btn {
            display: block;
            background: #3949ab;
            color: white;
            text-decoration: none;
            padding: 15px;
            margin: 10px 0;
            border-radius: 12px;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-3px);
            background: #303f9f;
        }

        .btn-red {
            background: #d32f2f;
        }

        .btn-red:hover {
            background: #c62828;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>الموصل شوب</h1>
        <p>الوثائق القانونية المطلوبة للنشر</p>
        <a href="privacy.html" class="btn">سياسة الخصوصية</a>
        <a href="delete-account.html" class="btn btn-red">تعليمات حذف الحساب</a>
    </div>
</body>

</html>
